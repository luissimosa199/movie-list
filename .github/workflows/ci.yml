name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movie_list_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movie_list_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movie_list_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/movie_list_test?schema=public
      TMDB_API_TOKEN: ci-build-placeholder
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-that-is-long-enough
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run lint
      - run: npm run build
